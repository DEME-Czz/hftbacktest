[package]
name = "hftbacktest"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "Rust order-book-driven HFT backtesting engine"
rust-version = "1.91.1"

[features]
default = ["backtest"]
backtest = ["zip", "uuid", "nom", "hftbacktest-derive"]
live = ["chrono", "tokio", "futures-util", "iceoryx2", "rand", "toml", "serde"]

[dependencies]
tracing = "0.1.43"
anyhow = "1.0.100"
thiserror = "2.0.17"
dyn-clone = "1.0.20"
bincode = "2.0.1"
chrono = { version = "0.4.42", optional = true }
tokio = { version = "1.48.0", features = ["full"], optional = true }
zip = { version = "6.0.0", optional = true }
futures-util = { version = "0.3.31", optional = true }
rand = { version = "0.9.2", optional = true }
uuid = { version = "1.19.0", features = ["v4"], optional = true }
nom = { version = "8", optional = true }
iceoryx2 = { version = "0.6.1", optional = true, features = ["logger_tracing"] }
serde = { version = "1.0.228", optional = true, features = ["derive"] }
toml = { version = "0.9.8", optional = true }
hftbacktest-derive = { path = "../hftbacktest-derive", optional = true, version = "0.2.0" }

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = [] }
clap = { version = "4.5.53", features = ["derive"] }
