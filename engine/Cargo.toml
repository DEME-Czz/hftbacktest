[package]
name = "hftbacktest"
version = "0.10.0"
edition = "2024"
license = "MIT"
description = "Rust order-book-driven L2 HFT backtesting engine"
rust-version = "1.91.1"

[features]
default = ["backtest"]
backtest = ["zip", "uuid", "nom"]

[dependencies]
tracing = "0.1.43"
anyhow = "1.0.100"
thiserror = "2.0.17"
dyn-clone = "1.0.20"
bincode = "2.0.1"
zip = { version = "6.0.0", optional = true }
uuid = { version = "1.19.0", features = ["v4"], optional = true }
nom = { version = "8", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = [] }
