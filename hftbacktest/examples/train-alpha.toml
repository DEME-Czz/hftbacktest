# 输入的 Alpha CSV 数据集路径；训练程序只读该文件。
input = "data/doge_alpha_2026072101.csv"
# 输出模型 JSON 路径；若文件已存在会覆盖。
output = "data/doge_alpha_2026072101.model.json"
# 标签预测跨度，单位为采样记录数。
horizon = 50
# 涨跌分类阈值，0.0002 表示未来中间价变化 0.02%。
threshold = 0.0002
# 按时间顺序用于训练的数据比例，必须在 0 到 1 之间。
train_ratio = 0.8
# 优化器遍历训练集的轮数。
epochs = 100
# 梯度下降学习率，过大会不收敛，过小会训练缓慢。
learning_rate = 0.05
# L2 正则化强度；0 表示禁用正则化。
l2 = 0.0001
