# Binance USD-M Futures production endpoints.
# This client connects and sends SUBSCRIBE requests, so use the combined-request
# public stream endpoint.
public_stream_url = "wss://fstream.binance.com/public/stream"

# User Data Stream uses the private endpoint. `{listen_key}` is replaced at runtime.
private_stream_url = "wss://fstream.binance.com/private/ws/{listen_key}"

api_url = "https://fapi.binance.com"

order_prefix = "hft"
api_key = ""
secret = ""
